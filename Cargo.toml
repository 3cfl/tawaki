[package]
name = "tawaki"
version = "1.0.2"
edition = "2021"
description = "The Fiordland Linux package manager"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.9"
dirs = "5"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
